[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rcn1-bridge"
version = "0.1.0"
description = "Low-latency DJI RC-N1 to virtual Xbox controller bridge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RC N1 Bridge contributors" }]
dependencies = [
  "pyserial==3.5",
  "vgamepad==0.1.0; sys_platform == 'win32'",
]

[project.scripts]
rcn1-bridge = "rcn1_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

